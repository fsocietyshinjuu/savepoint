name: Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify main process and scripts parse
        run: |
          for file in src/main/*.js scripts/*.mjs; do
            node --check "$file"
          done
      - name: Verify renderer parses as a module
        run: node --check src/renderer/js/app.js
