name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (for example 1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve version
        shell: bash
        run: node scripts/set-version.mjs
        env:
          SAVEPOINT_VERSION: ${{ inputs.version }}

      - name: Fetch engines, fonts, icons
        run: npm run assets

      - name: Prepare release metadata
        run: node scripts/prepare-release.mjs

      # Publish with gh rather than `--publish always`: electron-builder uploads
      # assets in parallel and has twice created two releases for the same tag,
      # which makes /releases/download/<tag>/latest.yml 404 and breaks updates.
      - name: Build installer
        run: npx electron-builder --config electron-builder.generated.yml --win nsis --publish never

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Savepoint-Setup-*.exe dist/latest.yml dist/*.blockmap \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/Savepoint-Setup-*.exe dist/latest.yml dist/*.blockmap \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: savepoint-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
